# Hegotá EIPs at the ethereum/EIPs commit used by the retrospective-eip-complexity LLM study
# (snapshot hegota-pfi-2026-08-26-ac450a4), so that Jev and that study score identical EIP text.
# The list is the 39 EIPs that study scored, with its stages and layer dispositions at the time.
# Results: docs/hegota-2026-08-26/. Compared with the LLM and human numbers in docs/hegota/comparison.html.

fork = "Hegota (2026-08-26 snapshot)"
meta_eip = 8081

eips_repo = "../EIPs"
eips_ref = "ac450a4ab2f37387385ee9c54b62f518d97e6cc9"

complexity_template = "templates/EIP-Complexity-Assessment.md"

jev_model = "jev-1.13.0"

output_dir = "docs/hegota-2026-08-26"
cache_dir = ".cache/eip-complexity"

render_html = true
force = false

[human_assessments]
repo = "ethspecs/pm"
path = "complexity_assessments/EIPs"
branch = "main"
pr_query = "is:pr complexity"

