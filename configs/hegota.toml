# Hegotá (EIP-8081) EIPs Scheduled (SFI), Considered (CFI) and Proposed (PFI) for Inclusion.
#
# Source: EIPS/eip-8081.md at ethereum/EIPs commit 24c0edb17b82cb65f26d29f03e084637ec2ae2d4
# ("Update EIP-8081: Decisions from ACDC187", 2026-09-21). `stage` is display-only metadata;
# it is never sent to Jev.
#
# `layer` follows the project-owner-approved layer dispositions of the retrospective-complexity-eval
# repository (Task 08 cohort review, snapshot hegota-pfi-2026-08-26-ac450a4, plus its SFI/CFI
# extension). EIPs with layer "consensus" or "informational" are recorded as not applicable to
# this execution-layer checklist and are not scored. EIPs that entered PFI after that snapshot
# (8142, 8198, 8355, 8365, 8369, 8371, 8379) have no disposition yet and carry no `layer`, so
# they are scored; classify them to change that.
#
# Paths are relative to the directory the command is run from (normally the repository root):
#
#     TYPESAFE_API_KEY=... uv run eip-complexity run configs/hegota.toml

fork = "Hegota"
meta_eip = 8081  # display-only: links the EIP count on the page to EIP-8081 at the assessed commit

eips_repo = "../EIPs"
eips_ref = "24c0edb17b82cb65f26d29f03e084637ec2ae2d4"  # empty or omitted: current remote default branch

complexity_template = "templates/EIP-Complexity-Assessment.md"

jev_model = "jev-1.13.0"  # what "jev-latest" resolved to on 2026-09-23; pinned so reruns are served from cache

output_dir = "docs/hegota"                # committed; served by GitHub Pages from /docs
cache_dir = ".cache/eip-complexity"      # gitignored; keeps reruns free of Jev calls

render_html = true
force = false

# Display-only pointer to the human checklists for the same EIPs (linked from the page).
[human_assessments]
repo = "ethspecs/pm"
path = "complexity_assessments/EIPs"
branch = "main"
pr_query = "is:pr complexity"

# Display-only pointer to the hand-generated comparison page next to the results (see README).
[comparison]
page = "comparison.html"
source_url = "https://danceratopz.github.io/retrospective-eip-complexity/prospective/hegota/?evaluator=llm"
source_label = "retrospective EIP complexity study"

